onboarding = false
# herdr configuration
# Place this file at ~/.config/herdr/config.toml

[keys]
# Prefix key to enter prefix mode (default: "ctrl+b")
prefix = "ctrl+a"

# Split panes, mirroring tmux's `bind |` (side-by-side) and `bind -` (stacked)
split_vertical = "prefix+|"
split_horizontal = "prefix+minus"

# Rename the current tab, mirroring tmux's prefix+, for renaming a window
rename_tab = "prefix+comma"

[theme]
name = "gruvbox"
auto_switch = false
